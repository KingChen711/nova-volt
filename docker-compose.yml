# NovaVolt MES — hạ tầng local
#
# Ranh giới mạng được dựng TRƯỚC khi có service nào, để không bao giờ phải "sửa lại cho
# đúng" sau. Đây là ràng buộc K11 trong AGENTS.md: service ở tầng IT không có route
# xuống tầng OT. Trong nhà máy thật đây là chính sách an ninh (IEC 62443 zones &
# conduits), không phải khuyến nghị.
#
# Profile:
#   (mặc định)  service cần cho M0-M12
#   obs         observability stack, bật từ M13 hoặc khi cần debug  (xem plan §2.2)
#   probe       container rỗng chỉ để kiểm chứng ranh giới mạng
#
# Mọi service PHẢI khai báo mem_limit: máy chỉ có 15,4 GB và cần biết cái nào ngốn.

name: novavolt-mes

networks:
  # Tầng nhà máy. internal: true = không ra internet, không tới network khác.
  # Thiết bị và simulator sống ở đây (M2).
  ot-net:
    internal: true

  # Vùng đệm. Broker và edge gateway đứng đây làm cầu nối OT <-> IT.
  dmz-net: {}

  # Hệ thống doanh nghiệp: database, bus, app, Mendix.
  it-net: {}

volumes:
  pgdata:
  mssqldata:
  rabbitmqdata:
  emqxdata:
  miniodata:

services:
  # ─────────────────────────────────────────────────────────
  # PostgreSQL + TimescaleDB — telemetry và read model
  #
  # KHÔNG dùng tag đuôi `-oss`: bản Apache-2 thiếu compression, continuous
  # aggregate và retention policy — đúng ba thứ scope.md §8.3 cần. Phải là bản
  # Community (TSL license), tức tag không có hậu tố.
  # Tag pin cứng, không dùng `latest-pg17`: build hôm nay và build 6 tháng nữa
  # phải cho cùng kết quả.
  # ─────────────────────────────────────────────────────────
  timescale:
    image: timescale/timescaledb:2.29.2-pg17
    container_name: nvm-timescale
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${NVM_POSTGRES_DB}
      POSTGRES_USER: ${NVM_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NVM_POSTGRES_PASSWORD}
    ports:
      - "${NVM_PORT_POSTGRES}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [it-net]
    healthcheck:
      # -h 127.0.0.1 là cố ý, KHÔNG bỏ đi. Trong lúc chạy init script, entrypoint
      # của Postgres đặt listen_addresses='' và chỉ mở unix socket. `pg_isready`
      # qua socket sẽ báo sẵn sàng khi schema CHƯA được tạo xong, và service phụ
      # thuộc sẽ khởi động quá sớm. Ép qua TCP thì chỉ xanh khi init đã xong thật.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # ─────────────────────────────────────────────────────────
  # SQL Server — event store và write model
  #
  # Chọn có chủ đích để bám sát Opcenter thật: kiến trúc tham chiếu của Siemens
  # dùng SQL Server làm primary data store. Bản 2022 chứ không phải 2025 — MES
  # trong nhà máy hiếm khi chạy phiên bản mới nhất.
  #
  # Đây là service ngốn RAM nhất (2 GB / 8 GB quota Docker) và khởi động chậm nhất,
  # nên nó là đường găng của D1 (`make up` < 5 phút).
  # ─────────────────────────────────────────────────────────
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    container_name: nvm-mssql
    restart: unless-stopped
    # SQL Server TỪ CHỐI khởi động nếu dưới 2 GB. Đừng hạ xuống để tiết kiệm.
    mem_limit: 2g
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # MSSQL_SA_PASSWORD, không phải SA_PASSWORD — biến cũ đã deprecated.
      MSSQL_SA_PASSWORD: ${NVM_MSSQL_SA_PASSWORD}
      MSSQL_AGENT_ENABLED: "false"
    ports:
      - "${NVM_PORT_MSSQL}:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    networks: [it-net]
    healthcheck:
      # Chỉ hỏi "server trả lời được chưa", CỐ Ý không hỏi database NovaVolt đã có chưa.
      # Nếu hỏi, sẽ khoá chết: mssql-init cần server healthy mới chạy được, mà server
      # lại cần init xong mới healthy. Service phụ thuộc về sau chờ mssql-init, không
      # chờ mssql. Xem C07.2 trong plan.
      # -C là bắt buộc: mssql-tools18 mặc định encrypt=yes, mà cert của server là self-signed.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

  # Chạy một lần rồi thoát. SQL Server không có cơ chế /docker-entrypoint-initdb.d
  # như Postgres, nên phải tự dựng bước này.
  # Script phải IDEMPOTENT vì nó chạy lại ở mọi lần `up`.
  mssql-init:
    # Profile `init` là BẮT BUỘC, không phải để cho gọn.
    # `docker compose up --wait` coi mọi container ĐÃ THOÁT là thất bại, kể cả khi
    # thoát 0. Đo được: up --wait chỉ với timescale+mssql -> exit 0; thêm mssql-init
    # vào -> exit 1 dù nó thoát 0. Để nó ngoài profile mặc định thì `up --wait` sạch,
    # còn init chạy bằng một bước riêng có mã thoát thật:
    #     docker compose up -d --wait
    #     docker compose run --rm mssql-init
    # `make up` ở C11 gộp đúng hai bước này.
    profiles: [init]
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    container_name: nvm-mssql-init
    restart: "no"
    mem_limit: 256m
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${NVM_MSSQL_SA_PASSWORD}
      NVM_MSSQL_APP_PASSWORD: ${NVM_MSSQL_APP_PASSWORD}
    volumes:
      - ./deploy/mssql/init:/init:ro
    networks: [it-net]
    entrypoint: ["/bin/bash", "-c"]
    # -b: thoát với mã lỗi khi SQL lỗi. Thiếu cờ này thì service_completed_successfully
    # vô nghĩa vì container vẫn thoát 0 dù script hỏng.
    #
    # PHẢI là list một phần tử. Nếu viết `command: >` dạng scalar, Compose tách chuỗi
    # theo khoảng trắng thành 14 tham số rời, và `bash -c` chỉ lấy tham số đầu làm
    # script — sqlcmd sẽ chạy trần không có đối số nào.
    command:
      - >
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
        -v AppPassword="$$NVM_MSSQL_APP_PASSWORD"
        -i /init/01-database.sql

  # ─────────────────────────────────────────────────────────
  # RabbitMQ — Manufacturing Service Bus
  #
  # Đây là hiện thân của "Bus-Centric Design", nguyên tắc thiết kế số 1 của
  # Opcenter Execution Foundation. Mọi giao tiếp giữa các Functional Block đi qua
  # đây, không gọi thẳng nhau. Lý do không phải thẩm mỹ mà là N15: MES chết thì
  # dây chuyền vẫn phải chạy, nên không được có lời gọi đồng bộ nào từ dưới lên.
  # ─────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4.3.5-management
    container_name: nvm-rabbitmq
    restart: unless-stopped
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: ${NVM_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${NVM_RABBITMQ_PASSWORD}
    ports:
      - "${NVM_PORT_RABBITMQ}:5672"
      - "${NVM_PORT_RABBITMQ_UI}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks: [it-net]
    healthcheck:
      # `ping` chỉ xác nhận Erlang node trả lời, chưa nói gì về việc broker nhận
      # được message. check_running + check_local_alarms mới là bộ kiểm chuẩn:
      # cái sau bắt được tình trạng broker còn sống nhưng đã chặn publisher vì
      # hết bộ nhớ hoặc hết đĩa — đúng kiểu hỏng âm thầm ở M2 khi bơm 5.000 msg/s.
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # ─────────────────────────────────────────────────────────
  # EMQX — MQTT broker, Unified Namespace
  #
  # CỐ Ý không nằm trên it-net. Nó bắc cầu ot-net <-> dmz-net, đúng vai trò
  # probe-dmz đã mô phỏng ở C05. Service .NET muốn nghe MQTT phải qua
  # Nvm.EdgeGateway đứng ở dmz-net (M2), không được nối thẳng.
  # Nếu thấy bất tiện, đó là dấu hiệu ranh giới đang hoạt động đúng.
  #
  # CỐ Ý KHÔNG CÓ `ports:` — đây là service duy nhất chạm ot-net.
  #
  # Publish port ra host mở lại đúng cái đường vừa chặn: container trên it-net
  # không tới được `nvm-emqx:1883`, nhưng tới được `host.docker.internal:1883`.
  # Đo được, không phải lo xa. Bind `127.0.0.1` KHÔNG cứu: proxy của Docker
  # Desktop nối tới host qua chính loopback, nên container it-net vẫn vào được
  # một port đã bind loopback. Cả hai số đo ở docs/plans/M0-bootstrap.md §C08.4.
  #
  # Muốn dùng MQTT hoặc gọi dashboard API lúc dev: `make dmz-shell`.
  # ─────────────────────────────────────────────────────────
  emqx:
    image: emqx/emqx:5.10.4
    container_name: nvm-emqx
    restart: unless-stopped
    # 512m KHÔNG đủ: đo được 411 MiB ngay lúc rảnh (80%), và EMQX bật cảnh báo
    # high_system_memory_usage ở ngưỡng 70%. Broker trong trạng thái cảnh báo sẽ
    # chặn publisher — đúng thứ sẽ giết mục tiêu 5.000 msg/s ở M2.
    mem_limit: 1g
    environment:
      # Tên node phải ổn định, nếu không EMQX coi mỗi lần khởi động là một node
      # mới và bỏ lại dữ liệu cũ trong volume.
      EMQX_NODE__NAME: emqx@nvm-emqx
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${NVM_EMQX_USER}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${NVM_EMQX_PASSWORD}
    volumes:
      - emqxdata:/opt/emqx/data
    networks: [ot-net, dmz-net]
    healthcheck:
      # KHÔNG dùng `emqx ctl status`: lệnh đó đi qua Erlang distribution và trong
      # image này báo "not responding to pings" dù broker chạy hoàn toàn bình thường
      # (endpoint /status trả 200, log ghi "EMQX is running now").
      # Kiểm qua HTTP đúng nguyên tắc đã dùng ở C06.2 và C07.2: healthcheck phải
      # thử đúng đường mà consumer thật đi, không phải đường ống nội bộ.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:18083/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ─────────────────────────────────────────────────────────
  # MinIO — object storage cho evidence
  #
  # Ảnh vision, đường cong formation thô, log máy. Trong DB chỉ lưu key + SHA-256.
  # Quy tắc scope.md §5.5: KHÔNG BAO GIỜ để blob trong DB giao dịch.
  # ─────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: nvm-minio
    restart: unless-stopped
    mem_limit: 512m
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${NVM_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${NVM_MINIO_PASSWORD}
    ports:
      - "${NVM_PORT_MINIO}:9000"
      - "${NVM_PORT_MINIO_UI}:9001"
    volumes:
      - miniodata:/data
    networks: [it-net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot: tạo bucket rồi thoát. Cùng profile `init` với mssql-init, cùng lý do
  # đã ghi ở C07.1 — `up --wait` coi container đã thoát là thất bại.
  minio-init:
    profiles: [init]
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: nvm-minio-init
    restart: "no"
    mem_limit: 128m
    depends_on:
      minio:
        condition: service_healthy
    environment:
      NVM_MINIO_USER: ${NVM_MINIO_USER}
      NVM_MINIO_PASSWORD: ${NVM_MINIO_PASSWORD}
    networks: [it-net]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set nvm http://minio:9000 "$$NVM_MINIO_USER" "$$NVM_MINIO_PASSWORD" &&
        mc mb --ignore-existing nvm/evidence &&
        mc mb --ignore-existing nvm/vision &&
        mc ls nvm

  # ─────────────────────────────────────────────────────────
  # Keycloak — identity provider cho cả .NET lẫn Mendix
  #
  # Cổng 8081 chứ không phải 8080: Mendix Studio Pro chạy app local ở 8080 và đổi
  # nó phiền hơn. Quyết định chốt ở C05, ghi trong .env.example.
  #
  # start-dev dùng H2 nhúng — chỉ hợp môi trường học. Production cần DB thật.
  # ─────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    container_name: nvm-keycloak
    restart: unless-stopped
    # 768m đo được 597 MiB (78%) ngay lúc rảnh, chưa có ai đăng nhập. JVM sát trần
    # thì lần đầu Mendix đăng nhập hàng loạt ở M4 sẽ bị OOM-kill. Nâng lên 1g.
    mem_limit: 1g
    command: ["start-dev", "--import-realm"]
    environment:
      # KC 26 đổi tên biến: KEYCLOAK_ADMIN cũ đã deprecated.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${NVM_KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${NVM_KEYCLOAK_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${NVM_PORT_KEYCLOAK}:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    # CỐ Ý không có volume cho H2.
    #
    # Lý do kỹ thuật: named volume gắn vào /opt/keycloak/data/h2 được Docker tạo với
    # chủ sở hữu root, còn Keycloak chạy bằng uid 1000, nên H2 chết với
    # AccessDeniedException ngay lúc khởi động.
    #
    # Nhưng lý do THIẾT KẾ mới là cái đáng giữ: không có volume thì mỗi lần khởi động
    # là một lần import lại realm từ file. File JSON trong git trở thành nguồn sự thật
    # duy nhất, và mọi thay đổi bấm tay trong console đều biến mất — buộc thay đổi phải
    # đi qua realm-novavolt.json và được commit. Đây là realm-as-code.
    networks: [it-net]
    healthcheck:
      # Health của KC 26 nằm ở MANAGEMENT PORT 9000, không phải 8080. Image lại
      # không có curl/wget, nên phải mở socket bằng bash. Xem C09.2 trong plan.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # Hai container rỗng, chỉ tồn tại để chứng minh ranh giới mạng có thật.
  # Không chạy trong `make up` thường — cần `--profile probe`.
  probe-ot:
    profiles: [probe]
    image: alpine:3.21
    container_name: nvm-probe-ot
    command: ["sleep", "infinity"]
    mem_limit: 32m
    networks: [ot-net]

  # Đứng hai chân trên ot-net và dmz-net — đúng vai trò EMQX sẽ đảm nhận ở C08.
  # Đây là con đường HỢP LỆ duy nhất để dữ liệu từ tầng nhà máy đi lên.
  #
  # Dùng image mosquitto chứ không phải alpine: `scripts/net-check.sh` cần chứng
  # minh đường hợp lệ bằng một vòng pub/sub MQTT THẬT, không chỉ bằng một cú bắt
  # tay TCP. Cùng lý do đã ghi ở C08.4 — thất bại hay thành công đều phải đúng
  # lý do, không chỉ đúng exit code.
  probe-dmz:
    profiles: [probe]
    image: eclipse-mosquitto:2.0.22
    container_name: nvm-probe-dmz
    command: ["sleep", "infinity"]
    mem_limit: 32m
    networks: [ot-net, dmz-net]

  probe-it:
    profiles: [probe]
    image: alpine:3.21
    container_name: nvm-probe-it
    command: ["sleep", "infinity"]
    mem_limit: 32m
    networks: [it-net]

  # ─────────────────────────────────────────────────────────
  # dmz-shell — bàn làm việc của người phát triển, đặt trong DMZ
  #
  # Sau khi EMQX bỏ `ports:`, đây là đường HỢP LỆ để một con người chạm tới
  # MQTT: bước vào vùng đệm rồi làm việc từ trong đó. Trong nhà máy thật, kỹ sư
  # không nối thẳng laptop vào mạng thiết bị mà đi qua một jump host ở DMZ —
  # container này chính là jump host đó, thu nhỏ.
  #
  # CHỈ có chân dmz-net, KHÔNG có ot-net. Một máy trạm của người dùng không được
  # đứng hai chân sang tầng thiết bị. probe-dmz có hai chân vì nó mô phỏng EMQX,
  # là thiết bị hạ tầng, không phải người.
  # ─────────────────────────────────────────────────────────
  dmz-shell:
    profiles: [tools]
    image: eclipse-mosquitto:2.0.22
    container_name: nvm-dmz-shell
    mem_limit: 64m
    stdin_open: true
    tty: true
    entrypoint: ["/bin/sh"]
    networks: [dmz-net]
