# NovaVolt MOM v2 — hạ tầng local
#
# Ba vùng mạng (K11): `ot-net` là phía xưởng (LineDB, line simulator), `it-net` là MOM và hệ
# doanh nghiệp. Chỉ relay và lệnh đọc tin của Foundation được nối vào LineDB (R5).
#
# Profile:
#   (mặc định)  hạ tầng MOM: SQL Server, RabbitMQ, Keycloak, LineDB, Redpanda, Mailpit
#   init        job một lần: tạo database SQL Server
#
# Observability (OTel, Tempo, Loki, Prometheus, Grafana) quay lại khi Foundation có host ở R1–R2;
# cấu hình v1 nằm ở tag v1.0.
#
# Mọi service khai báo mem_limit, và mọi `ports:` bind 127.0.0.1: Docker publish mặc định ra mọi
# interface, và mật khẩu mẫu nằm trong .env.example đã commit.

name: novavolt-mes

networks:
  ot-net: {}
  it-net: {}

volumes:
  mssqldata:
  rabbitmqdata:
  linedbdata:
  redpandadata:

services:
  # DB MOM của một plant, như DB của Opcenter: mọi app của plant dùng chung (K3).
  # SQL Agent bật để chạy cleaning rules ở R12.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    container_name: nvm-mssql
    restart: unless-stopped
    # SQL Server từ chối khởi động nếu dưới 2 GB.
    mem_limit: 2g
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${NVM_MSSQL_SA_PASSWORD}
      MSSQL_AGENT_ENABLED: "true"
    ports:
      - "127.0.0.1:${NVM_PORT_MSSQL}:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    networks: [it-net]
    healthcheck:
      # Chỉ hỏi server trả lời được chưa: mssql-init cần server healthy mới chạy được.
      # -C bắt buộc: mssql-tools18 mặc định encrypt=yes, cert của server là self-signed.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

  # Profile `init`: `up --wait` coi container đã thoát là thất bại, kể cả thoát 0.
  mssql-init:
    profiles: [init]
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    container_name: nvm-mssql-init
    restart: "no"
    mem_limit: 256m
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${NVM_MSSQL_SA_PASSWORD}
      NVM_MSSQL_APP_PASSWORD: ${NVM_MSSQL_APP_PASSWORD}
    volumes:
      - ./deploy/mssql/init:/init:ro
    networks: [it-net]
    entrypoint: ["/bin/bash", "-c"]
    # Phải là list một phần tử: dạng scalar bị Compose tách thành nhiều tham số rời.
    command:
      - >
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
        -v AppPassword="$$NVM_MSSQL_APP_PASSWORD"
        -i /init/01-database.sql

  # Bus event của Foundation: event lưu lúc commit rồi phát lên đây (R2).
  rabbitmq:
    image: rabbitmq:4.3.5-management
    container_name: nvm-rabbitmq
    restart: unless-stopped
    mem_limit: 512m
    # Node name bám hostname; hostname mặc định là container id nên mỗi lần recreate là một node
    # mới và state durable bị bỏ lại trong volume.
    hostname: nvm-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${NVM_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${NVM_RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:${NVM_PORT_RABBITMQ}:5672"
      - "127.0.0.1:${NVM_PORT_RABBITMQ_UI}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks: [it-net]
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Danh tính và role. Realm vẫn là bản v1, viết lại theo vai v2 ở R2.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    container_name: nvm-keycloak
    restart: unless-stopped
    mem_limit: 1g
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${NVM_KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${NVM_KEYCLOAK_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${NVM_PORT_KEYCLOAK}:8080"
    # Không có volume cho H2: mỗi lần recreate là import lại realm từ file (realm-as-code).
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    networks: [it-net]
    healthcheck:
      # Health của KC 26 ở management port 9000; image không có curl nên mở socket bằng bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # Database phía xưởng: máy ghi bảng ở đây, trigger chép sang bảng trung gian chờ MOM đọc (R5).
  # Ở ot-net và it-net: vai của nó là chỗ giao duy nhất giữa hai vùng; quyền vào schema trung
  # gian giới hạn bằng role riêng ở R5.
  linedb:
    image: postgres:17.6
    container_name: nvm-linedb
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${NVM_LINEDB_DB}
      POSTGRES_USER: ${NVM_LINEDB_USER}
      POSTGRES_PASSWORD: ${NVM_LINEDB_PASSWORD}
    ports:
      - "127.0.0.1:${NVM_PORT_LINEDB}:5432"
    volumes:
      - linedbdata:/var/lib/postgresql/data
    networks: [ot-net, it-net]
    healthcheck:
      # -h 127.0.0.1: trong lúc chạy init script, Postgres chỉ mở unix socket; ép qua TCP thì chỉ
      # xanh khi init đã xong thật.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # Kafka API cho gateway (R11): lịch xe của nhà cung cấp và đơn của khách đi qua Kafka như ở dự án thật.
  redpanda:
    image: redpandadata/redpanda:v25.2.10
    container_name: nvm-redpanda
    restart: unless-stopped
    mem_limit: 1g
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${NVM_PORT_KAFKA}
    ports:
      - "127.0.0.1:${NVM_PORT_KAFKA}:19092"
    volumes:
      - redpandadata:/var/lib/redpanda/data
    networks: [it-net]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Bắt mọi email MOM gửi (danh sách pallet staged, xe rời, skid chưa nhận…); xem ở giao diện web.
  mailpit:
    image: axllent/mailpit:v1.27.10
    container_name: nvm-mailpit
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:${NVM_PORT_SMTP}:1025"
      - "127.0.0.1:${NVM_PORT_MAIL_UI}:8025"
    networks: [it-net]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
