{{- /* Migration chạy trước install/upgrade bằng image của workload, với credential migration riêng. */ -}}
{{- $images := dict }}
{{- range $workload := concat .Values.apps .Values.workers }}
{{- $_ := set $images $workload.name (printf "%s:%s" $workload.image $workload.tag) }}
{{- end }}
{{- range $migration := .Values.migrations }}
{{- $image := index $images $migration.workload }}
{{- if $image }}
{{- $ctx := dict "root" $ "name" $migration.workload }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-migrate" $migration.name }}
  labels:
    {{- include "novavolt.labels" $ctx | nindent 4 }}
    {{- include "novavolt.selector" $ctx | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": {{ $migration.weight | default 0 | quote }}
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ $image | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          args: {{ toJson $migration.args }}
          envFrom:
            - secretRef:
                name: {{ printf "%s-%s-migrate" $.Release.Name $migration.name }}
          {{- include "novavolt.securityContext" $ctx | nindent 10 }}
{{- end }}
{{- end }}
