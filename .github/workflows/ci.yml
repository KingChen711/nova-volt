# CI cho NovaVolt MOM v2
#
# Các bước ở đây PHẢI khớp với target `ci` trong Makefile. Hai bên lệch nhau thì CI không
# còn là thứ dự đoán được, và người ta sẽ học cách bỏ qua nó.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: workflow này chỉ đọc code, không ghi gì lên repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # K14: repo public không được chứa tên, mã của dự án khách hàng. Danh sách từ cấm chỉ có
  # dạng HMAC trong repo; khóa là secret. PR từ fork không có secret nên bước này chỉ bắt buộc
  # khi push lên main.
  cleanroom:
    name: Clean-room
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files
        env:
          NVM_CLEANROOM_KEY: ${{ secrets.NVM_CLEANROOM_KEY }}
          NVM_CLEANROOM_REQUIRED: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python3 -I -X utf8 tools/cleanroom/check.py

  build:
    name: Build, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Không ghi cứng version: global.json đã pin SDK.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore NovaVolt.Mes.slnx

      # Chạy TRƯỚC build: một lỗi thụt lề không đáng phải chờ hết một lần build Release.
      - name: Format check
        run: dotnet format NovaVolt.Mes.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build NovaVolt.Mes.slnx -c Release --no-restore --nologo

      # MTP mode bật trong global.json và đổi cú pháp: phải là --solution.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test --solution NovaVolt.Mes.slnx -c Release --no-build 2>&1 | tee test.log

      # Log của job cần đăng nhập mới đọc được; annotation thì đọc được qua API công khai.
      - name: Report failed tests
        if: failure()
        shell: bash
        run: |
          sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' test.log > test.plain.log
          grep -E -A6 'failed [A-Za-z]' test.plain.log | grep -E 'failed [A-Za-z]|Exception|should|but was|error' | head -40 \
            | sed -E 's/^[[:space:]]*/::error title=Test failed::/' || true
          echo "failed lines: $(grep -cE 'failed [A-Za-z]' test.plain.log || true)"

  # Web Next.js: kiểm kiểu và build, cùng lệnh với `make web-ci`. Không cần MOM hay Keycloak đang chạy.
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, typecheck, build
        run: make web-ci
